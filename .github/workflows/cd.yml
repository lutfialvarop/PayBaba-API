name: CD - Build & Deploy to Single Server

on:
    push:
        branches:
            - main

env:
    REGISTRY: docker.io
    # Format Image: username/repo
    IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/paybaba-api
    SWARM_MASTER_HOST: ${{ secrets.SWARM_MASTER_HOST }}
    SWARM_MASTER_USER: ${{ secrets.SWARM_MASTER_USER }}
    APP_DOMAIN: "apipaybaba.lutfialvarop.com"

jobs:
    # ═══════════════════════════════════════════════════════════
    # 1. BUILD & PUSH DOCKER IMAGE
    # ═══════════════════════════════════════════════════════════
    build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        outputs:
            image_tag: ${{ steps.meta.outputs.tags }}

        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Extract Metadata (Tags)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long

            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ═══════════════════════════════════════════════════════════
    # 2. DEPLOY VIA DOCKER COMPOSE
    # ═══════════════════════════════════════════════════════════
    deploy:
        name: Update Server
        needs: build # Wajib nunggu build selesai
        runs-on: ubuntu-latest

        steps:
            # Wajib checkout kode agar bisa mengambil file docker-compose.yml lokal
            - uses: actions/checkout@v4

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh

                  # 1. Decode Base64 ke file
                  printf "%s" "${{ secrets.SWARM_MASTER_SSH_KEY }}" | base64 -d > ~/.ssh/server_key

                  # 2. Tambahkan baris baru di akhir file
                  echo "" >> ~/.ssh/server_key

                  # 3. Atur permission
                  chmod 600 ~/.ssh/server_key

                  # 4. Validasi
                  if head -n 1 ~/.ssh/server_key | grep -q "BEGIN"; then
                    echo "✅ SSH Key format looks correct (Header found)."
                  else
                    echo "❌ Error: Decoded key does not look like a valid PEM key."
                    exit 1
                  fi

                  # 5. Scan host
                  ssh-keyscan -H ${{ env.SWARM_MASTER_HOST }} >> ~/.ssh/known_hosts

            # Langkah baru: Copy file docker-compose.yml dari repo ke dalam server
            - name: Copy docker-compose.yml to Server
              run: |
                  scp -i ~/.ssh/server_key docker-compose.yml ${{ env.SWARM_MASTER_USER }}@${{ env.SWARM_MASTER_HOST }}:~/docker-compose.yml

            - name: Execute Remote Deployment
              run: |
                  ssh -i ~/.ssh/server_key ${{ env.SWARM_MASTER_USER }}@${{ env.SWARM_MASTER_HOST }} << 'EOF'
                  set -e

                  echo "🚀 Starting Deployment for paybaba-api"

                  # Login Docker
                  echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

                  echo "🌐 Connecting existing postgres_db to the application network..."
                  # Buat network jika belum ada, lalu masukkan postgres_db ke dalamnya
                  docker network create paybaba_network || true
                  docker network connect paybaba_network postgres_db || true

                  echo "📝 Generating .env file on server..."
                  cat <<EOT > .env
                  NODE_ENV=production
                  IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  DB_HOST=postgres_db
                  DB_PORT=5432
                  DB_NAME=${{ secrets.DB_NAME }}
                  DB_USER=${{ secrets.DB_USER }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  BASE_URL=${{ secrets.BASE_URL }}
                  FRONTEND_URL=${{ secrets.FRONTEND_URL }}
                  JWT_ACCESS_TOKEN_SECRET=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
                  JWT_REFRESH_TOKEN_SECRET=${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
                  JWT_ACCESS_TOKEN_EXPIRY=${{ secrets.JWT_ACCESS_TOKEN_EXPIRY }}
                  JWT_REFRESH_TOKEN_EXPIRY=${{ secrets.JWT_REFRESH_TOKEN_EXPIRY }}
                  QWEN_API_KEY=${{ secrets.QWEN_API_KEY }}
                  QWEN_BASE_URL=${{ secrets.QWEN_BASE_URL }}
                  MID=${{ secrets.MID }}
                  PRIVATE_KEY="${{ secrets.PRIVATE_KEY }}"
                  PUBLIC_KEY="${{ secrets.PUBLIC_KEY }}"
                  PAYLABS_SERVER=${{ secrets.PAYLABS_SERVER }}
                  PAYLABS_BASE_URL=${{ secrets.PAYLABS_BASE_URL }}
                  NOTIFY_URL=${{ secrets.NOTIFY_URL }}
                  APP_DOMAIN=${{ env.APP_DOMAIN }}
                  EOT

                  echo "♻️ Pulling latest image and recreating containers..."
                  docker compose pull
                  docker compose up -d --remove-orphans

                  echo "🧹 Cleaning up old unused images..."
                  docker image prune -f

                  echo "✅ Deployment commands executed successfully."
                  EOF

            - name: Cleanup Key
              if: always()
              run: rm -f ~/.ssh/server_key

    # ═══════════════════════════════════════════════════════════
    # 3. HEALTH CHECK
    # ═══════════════════════════════════════════════════════════
    health-check:
        name: Verify Production Health
        needs: deploy
        runs-on: ubuntu-latest
        steps:
            - name: Check URL
              run: |
                  echo "Waiting for Nginx routing and App initialization..."
                  for i in {1..10}; do
                    # -k untuk bypass SSL check (jika baru renew)
                    STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://${{ env.APP_DOMAIN }}/health)
                    if [ "$STATUS" == "200" ]; then
                      echo "✅ Health check PASSED (200 OK)"
                      exit 0
                    fi
                    echo "Attempt $i: Got status $STATUS. Retrying in 10s..."
                    sleep 10
                  done
                  echo "❌ Health check FAILED"
                  exit 1
