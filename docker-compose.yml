version: "3.8"

services:
    api:
        image: ${IMAGE_TAG}
        container_name: paybaba_api
        restart: always
        environment:
            NODE_ENV: production
            DB_HOST: postgres_db
            DB_PORT: 5432
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            BASE_URL: ${BASE_URL}
            FRONTEND_URL: ${FRONTEND_URL}
            JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET}
            JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
            JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
            JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
            QWEN_API_KEY: ${QWEN_API_KEY}
            QWEN_BASE_URL: ${QWEN_BASE_URL}
            MID: ${MID}
            PRIVATE_KEY: ${PRIVATE_KEY}
            PUBLIC_KEY: ${PUBLIC_KEY}
            PAYLABS_SERVER: ${PAYLABS_SERVER}
            PAYLABS_BASE_URL: ${PAYLABS_BASE_URL}
            NOTIFY_URL: ${NOTIFY_URL}
        ports:
            - "127.0.0.1:3001:3000"
        networks:
            - paybaba_network

networks:
    paybaba_network:
        name: paybaba_network # Mengunci nama jaringan virtual
        driver: bridge
